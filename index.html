<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AML Store MX</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f8f8f8;
}

header{
    text-align:center;
    padding:30px;
    background:white;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

h1{
    margin:0;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:25px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
    cursor:pointer;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.card h2{
    text-align:center;
    padding:15px;
}

    header{
    background:white;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.logo-container{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:30px;
}

#logo{
    width:120px;
    height:120px;
}

#loading{
    text-align:center;
    font-size:20px;
    padding:40px;
    color:#666;
}

.seccion{
    text-align:center;
    margin-top:30px;
    margin-bottom:10px;
    font-size:32px;
}

.redes{
    margin-top:35px;
    padding:45px 20px;
    text-align:center;
    background:white;
    border-top:1px solid #e8e8e8;
}

.redes h2{
    margin:0 0 10px;
    font-size:30px;
}

.texto-redes{
    margin:0 0 28px;
    color:#666;
}

.contenedor-redes{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:30px;
}

.red-social{
    min-width:120px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    color:#222;
    text-decoration:none;
    font-weight:bold;
    transition:.2s;
}

.red-social:hover{
    transform:translateY(-4px);
}

.icono-red{
    width:65px;
    height:65px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f3e6e9;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
    font-size:28px;
}
</style>

</head>
<body>

<header id="header">
    <div class="logo-container">
        <img id="logo">
        <div>
            <h1>AML Store MX</h1>
            <p>Joyería y accesorios</p>
        </div>
    </div>
</header>

<div id="loading">
    Cargando catálogo...
</div>

<h2 class="seccion">
    Nuestras categorías
</h2>
    
<div id="categorias" class="grid"></div>

<section class="redes">

    <h2>Síguenos en nuestras redes</h2>

    <!--
        Más adelante cambia href="#" por la URL real,
        por ejemplo:
        href="https://www.instagram.com/amlstore.mx/"
    -->

    <a
        id="enlaceRedSocial"
        class="enlace-red"
        href="#"
        aria-label="Red social de AML Store MX"
    >
        <div class="imagen-red">

            <!-- Imagen comodín en formato SVG -->

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
            >
                <circle cx="12" cy="12" r="9"></circle>
                <circle cx="12" cy="10" r="3"></circle>
                <path d="M6.8 18c1.2-3 3-4.4 5.2-4.4S16 15 17.2 18"></path>
            </svg>

        </div>

        <strong>AML Store MX</strong>

        <span class="texto-provisional">
            Próximamente
        </span>
    </a>

</section>
    
<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyUyG3KOQkGUxBCF7zH9IyvoQCV5QW6SQNvN3hNFb5ch2Ir-kkdMtxgvBMfaDd-3IGiJg/exec";

fetch(API_URL)
.then(r => r.json())
.then(data => {
    document.getElementById("logo")
    .src = data.logo.url;

    const contenedor =
        document.getElementById("categorias");

    data.categorias
        .filter(c => c.Visible === "SI")
        .sort((a,b) => a.Orden - b.Orden)
        .forEach(cat => {

            contenedor.innerHTML += `
            <a
            href="categoria.html?categoria=${cat["Categoría"]}"
            style="text-decoration:none;color:black;"
            >
            <div class="card">
                <img src="${cat.ImagenInfo.url}">
                <h2>${cat["Categoría"]}</h2>
            </div>
            </a>
            `;
        });

    document.getElementById("loading").style.display = "none";

});

</script>

</body>
</html>
